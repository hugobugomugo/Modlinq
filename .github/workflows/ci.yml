name: ci

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod_manager_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # infos are not fatal: 249 avoid_print hits are pre-existing
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: mod_manager_flutter

      - run: flutter build linux --release
        working-directory: mod_manager_flutter
