name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: version to build, without the v prefix
        required: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config liblzma-dev zip

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: mod_manager_flutter

      - run: flutter build linux --release
        working-directory: mod_manager_flutter

      # zip the bundle contents, not the wrapper dir, so the updater can swap in place
      - name: package
        run: |
          cd mod_manager_flutter/build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/modlinq-${{ needs.version.outputs.version }}-linux-x64.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: modlinq-*-linux-x64.zip

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: mod_manager_flutter

      - name: package
        run: .\windows_installer\build_portable.ps1 -Version ${{ needs.version.outputs.version }}
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: windows_installer/output/modlinq-*-windows-x64.zip

  publish:
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
