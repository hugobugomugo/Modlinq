name: release

on:
  push:
    tags: ['v*']
    branches: [test]
  workflow_dispatch:
    inputs:
      version:
        description: version to build, without the v prefix
        required: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: v
        run: |
          set -eu
          pubver() { grep -m1 '^version:' | sed 's/^version:[[:space:]]*//' | cut -d+ -f1; }

          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
            echo "version=$v"     >> "$GITHUB_OUTPUT"
            echo "tag=v$v"        >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "build=true"     >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
            echo "version=$v"     >> "$GITHUB_OUTPUT"
            echo "tag=v$v"        >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "build=true"     >> "$GITHUB_OUTPUT"
          else
            # dev build off test, only when the pubspec version actually moved
            new=$(pubver < mod_manager_flutter/pubspec.yaml)
            old=$(git show HEAD~1:mod_manager_flutter/pubspec.yaml 2>/dev/null | pubver || true)
            echo "pubspec version: '$old' -> '$new'"
            if [ "$new" = "$old" ]; then
              echo "unchanged, skipping build"
              echo "build=false" >> "$GITHUB_OUTPUT"
            else
              v="$new-dev.${{ github.run_number }}"
              echo "version=$v"    >> "$GITHUB_OUTPUT"
              echo "tag=v$v"       >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "build=true"    >> "$GITHUB_OUTPUT"
            fi
          fi

  linux:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: stamp dev version
        if: needs.version.outputs.prerelease == 'true'
        shell: bash
        run: |
          sed -i "s|^const String appVersion = .*|const String appVersion = '${{ needs.version.outputs.version }}';|" \
            mod_manager_flutter/lib/core/app_version.dart
          cat mod_manager_flutter/lib/core/app_version.dart

      - name: install linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config liblzma-dev zip

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: mod_manager_flutter

      - run: flutter build linux --release
        working-directory: mod_manager_flutter

      # zip the bundle contents, not the wrapper dir, so the updater can swap in place
      - name: package
        run: |
          cd mod_manager_flutter/build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/modlinq-${{ needs.version.outputs.version }}-linux-x64.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: modlinq-*-linux-x64.zip

  windows:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: stamp dev version
        if: needs.version.outputs.prerelease == 'true'
        shell: bash
        run: |
          sed -i "s|^const String appVersion = .*|const String appVersion = '${{ needs.version.outputs.version }}';|" \
            mod_manager_flutter/lib/core/app_version.dart
          cat mod_manager_flutter/lib/core/app_version.dart

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: mod_manager_flutter

      # inappwebview_windows still includes <experimental/coroutine>, which
      # newer msvc rejects unless the deprecation assert is silenced
      - name: package
        run: .\windows_installer\build_portable.ps1 -Version ${{ needs.version.outputs.version }}
        shell: pwsh
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: windows_installer/output/modlinq-*-windows-x64.zip

  publish:
    needs: [version, linux, windows]
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo 'RELEASE_BODY<<GHEOF'
            echo '### sha256'
            echo ''
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo 'GHEOF'
          } >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body: ${{ env.RELEASE_BODY }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
