; example keybind config for a character
; goes in the character folder inside savemods
; e.g. savemods/anby/config.ini or savemods/ellen/mod_config.ini

[keySwap]
Key1=VK_F1
Key2=VK_F2
Key3=VK_F3
SwapMode=toggle
Description=Swap between different character skins

[KeyUP]
Key=VK_UP
Action=jump
Speed=1.5

[KeyDown]
Key=VK_DOWN
Action=crouch

[CustomKeybinds]
OpenMenu=VK_M
ToggleHUD=VK_H
Screenshot=VK_F12

[KeyBindings]
Primary=VK_LBUTTON
Secondary=VK_RBUTTON
Reload=VK_R
Use=VK_E

[HotkeySettings]
QuickSave=F5
QuickLoad=F9
Console=~
